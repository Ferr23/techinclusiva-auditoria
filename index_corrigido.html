<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal TechInclusiva - Corrigido</title>
</head>
<body>

    <header>
        <h1>Portal TechInclusiva</h1>
    </header>

    <main>
        <section>
            <h2>Notícias de Tecnologia</h2>

            <p>Confira nossas notícias sobre tecnologia e acessibilidade.</p>

            <p style="color: #333333;">
                Confira as novidades da tecnologia.
            </p>

            <a href="#contato">
                Acessar formulário de contato
            </a>
        </section>

        <section id="contato">
            <h2>Entre em contato</h2>

            <form>
                <label for="nome">Seu nome:</label>
                <input type="text" id="nome" name="nome">

                <label for="email">Seu e-mail:</label>
                <input type="email" id="email" name="email">

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

</body>
</html>
